background {
    monitor =
    path = ~/png/wallpaper/lain_makePC.png
    blur_passes = 2
    blur_size = 5
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    outer_color = rgb(33ccff)
    inner_color = rgb(1a1b26)
    font_color = rgb(c0caf5)
    placeholder_text = <i>Password...</i>
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgba(c0caf5ff)
    font_size = 48
    font_family = Hack Nerd Font
    position = 0, -100
    halign = center
    valign = top
}
